name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-escrita
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Otimizar imagens
        run: npm run otimizar-imagens

      - name: Verificar imagens
        run: npm run verificar-imagens || echo "::warning::Há imagens acima de 3000 px ou 3 MB depois da otimização."

      - name: Salvar imagens otimizadas no repositório
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- src; then
            echo "Nenhuma imagem alterada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- src
          git commit -m "Otimiza imagens enviadas [skip ci]"
          if git pull --rebase origin main && git push origin HEAD:main; then
            echo "Imagens otimizadas salvas na main."
          else
            git rebase --abort 2>/dev/null || true
            echo "::warning::Não foi possível enviar as imagens otimizadas para a main. O deploy segue com as versões otimizadas."
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - id: versao-playwright
        run: echo "versao=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versao-playwright.outputs.versao }}

      - run: npx playwright install --with-deps chromium

      - run: npm run pdf:dist
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Testar o site antes de publicar
        id: testes
        run: npx playwright test
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Resumo dos testes
        if: always() && steps.testes.outcome != 'skipped'
        run: node scripts/resumo-testes.mjs

      - name: Enviar relatório dos testes
        if: failure() && steps.testes.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            relatorio-testes/
            resultados-testes/
          retention-days: 14

      - name: Lighthouse (celular)
        id: lighthouse
        run: npm run lighthouse
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Enviar relatório do Lighthouse
        if: always() && steps.lighthouse.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-lighthouse
          path: relatorio-lighthouse/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
